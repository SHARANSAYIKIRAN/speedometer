; PlatformIO Project Configuration File for RallyDash
; Target: ESP32-WROOM-32 / ESP32-DevKitC
; Display: 2.8" 320x240 SPI TFT (ILI9341 / ST7789)
; Interface: Bluetooth Classic ELM327 (SPP)

[platformio]
default_envs = esp32_rallydash
src_dir = src
include_dir = include

[env:esp32_rallydash]
platform = espressif32 @ ^6.5.0
board = esp32dev
framework = arduino

; Clock frequency
board_build.f_cpu = 240000000L
board_build.f_flash = 80000000L
board_build.flash_mode = qio

; Partition scheme (allows plenty of space for BT Classic stack + LVGL fonts)
board_build.partitions = min_spiffs.csv

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

build_flags = 
    -D LV_CONF_INCLUDE_SIMPLE
    -I .
    -I include
    -D CORE_DEBUG_LEVEL=3
    -O2
    -std=gnu++17

lib_deps = 
    lvgl/lvgl @ ~8.4.0
    lovyan03/LovyanGFX @ ^1.1.12

